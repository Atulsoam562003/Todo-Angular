<app-todo-add (todoAdd)="todoAdd($event)"></app-todo-add>
<h4>
    Your Todos
</h4>
<div *ngIf="this.todos.length === 0; else elseBlock">
    <p>There are no todos to show! Please add some todos.</p>
</div>
<ng-template #elseBlock>
    <div *ngFor="let todo of todos">
        <app-todo-item [todo]="todo" (todoDelete)="deleteTodo($event)" (todoChecked)="toggleTodo($event)"></app-todo-item>
    </div>
</ng-template>
