<div class="my-3">
    <h5 [ngClass]="{'strike': !todo.active, 'noStrike': todo.active}">{{ todo.title }}</h5>
    <p [ngClass]="{'strike': !todo.active, 'noStrike': todo.active}">{{ todo.desc }}</p>
    <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1" (click)="onChecking(todo)" [checked]='!todo.active'>
    <label class="form-check-label" for="exampleCheck1">Done</label>
  </div>
    <button class="btn btn-sm btn-danger" (click)="deleteTodo(todo)">Delete</button>
</div>
